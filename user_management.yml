---
- name: Manage a Linux lab user
  hosts: managed
  become: true

  vars:
    lab_username: ansible_lab_user
    create_user_home: true

  tasks:
    - name: Ensure lab user exists
      ansible.builtin.user:
        name: "{{ lab_username }}"
        state: present
        create_home: "{{ create_user_home }}"
